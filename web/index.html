<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Cat Breads Lounge</title>

<style>
  :root { --paper: #fff7ee; --ink: #3a2418; --wall: #a2553f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--wall); font-family: system-ui, -apple-system, sans-serif; }
  body { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none;         /* no rubber-banding, page zoom or text selection on iPad */
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #mute { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 44px; height: 44px; touch-action: manipulation; display: grid; place-items: center; color: var(--ink);
          background: rgba(255, 247, 238, 0.86); border: 0; border-radius: 50%; padding: 0; cursor: pointer;
          box-shadow: 0 2px 10px rgba(58, 36, 24, 0.25); transition: transform 0.15s ease, background 0.15s ease; }
  #mute:hover { transform: scale(1.08); background: rgba(255, 247, 238, 0.98); }
  #mute:active { transform: scale(0.96); }
  #mute svg { width: 22px; height: 22px; display: block; }
  #mute .off { display: none; }
  #mute.muted .on { display: none; }
  #mute.muted .off { display: block; }
  #mute.muted { color: #8a6a58; }
  @media (pointer: coarse) { #mute { width: 52px; height: 52px; } #mute svg { width: 26px; height: 26px; } #mute:hover { transform: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" class="muted" type="button" aria-label="Unmute music" title="Unmute music">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M3 3l18 18"/>
  </svg>
</button>
<script type="module" src="main.js?v=audio-4"></script>
</body>
</html>
